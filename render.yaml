# Render.com yapılandırması — bu uygulama statik bir sitedir, port gerektirmez.
# Render panelinde "New +" > "Blueprint" ile bu repo seçildiğinde otomatik kurulur.
# Elle kurulum için: "New +" > "Static Site" seçin,
#   Build Command:   npm install && npm run build
#   Publish Directory: dist
# ve Redirects/Rewrites bölümüne  /*  ->  /index.html  (Rewrite) ekleyin.
services:
  - type: web
    name: minibank
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html